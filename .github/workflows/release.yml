name: ZapQ CI / Release

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: 0
  GOFLAGS: -trimpath

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" && echo "$out" && exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Validate openapi.yaml parses
        run: python3 -c "import yaml; yaml.safe_load(open('openapi.yaml'))"
      - name: Staticcheck
        if: matrix.go == 'stable'
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Vulnerability scan
        if: matrix.go == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test (race detector + coverage)
        run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report
        if: matrix.go == 'stable'
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - name: Fuzz (short)
        if: matrix.go == 'stable'
        run: |
          go test -run '^$' -fuzz '^FuzzParseSize$' -fuzztime=15s .
          go test -run '^$' -fuzz '^FuzzSnapshotLoad$' -fuzztime=15s .
          go test -run '^$' -fuzz '^FuzzFrames$' -fuzztime=15s ./internal/frames
      - name: Benchmarks (sanity run)
        if: matrix.go == 'stable'
        run: go test -bench=. -benchtime=100x -run '^$' .

  docker-build-check:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Set version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          mkdir -p dist
          OUT="zapq-${{ matrix.goos }}-${{ matrix.goarch }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${OUT}" .

      - name: Compress
        run: |
          cd dist
          OUT="zapq-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar czf "${OUT}.tar.gz" "${OUT}"
          rm "${OUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Sign checksums (keyless)
        run: |
          cd dist
          cosign sign-blob --yes SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/zapq.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
